<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 確率ラボ21 のアイコン: フェルト地に「21」のカードと「%」のチップ -->
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f7a4d"/>
      <stop offset="1" stop-color="#05361f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#felt)" stroke="url(#gold)" stroke-width="3"/>
  <g transform="rotate(-14 24 33)">
    <rect x="11" y="15" width="25" height="35" rx="4" fill="#b91c1c" stroke="#fff" stroke-width="2"/>
    <path d="M15 19 L32 46 M32 19 L15 46" stroke="#fff" stroke-opacity=".25" stroke-width="1.5"/>
  </g>
  <g transform="rotate(8 36 31)">
    <rect x="22" y="11" width="28" height="38" rx="4" fill="#fff" stroke="#d4d4d4"/>
    <text x="25" y="20" font-size="8" fill="#dc2626" font-family="Arial, sans-serif">&#9829;</text>
    <text x="36" y="37" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="17" fill="#111">21</text>
  </g>
  <circle cx="49" cy="49" r="11" fill="url(#gold)" stroke="#78350f" stroke-width="1.5"/>
  <circle cx="49" cy="49" r="7.6" fill="none" stroke="#fff" stroke-width="1.3" stroke-dasharray="2.6 2"/>
  <text x="49" y="53" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="11" fill="#451a03">%</text>
</svg>
